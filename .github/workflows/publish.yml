name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Debug auth
        run: |
          echo "npmrc contents:"
          cat $NPM_CONFIG_USERCONFIG | sed 's/_authToken=.*/_authToken=REDACTED/'
          echo "npm whoami:"
          npm whoami || echo "whoami FAILED - token is invalid"

      - name: Publish
        run: npm publish --access public
